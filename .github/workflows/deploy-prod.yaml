name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
    types: [closed]

jobs:
  # Call existing workflows
  run-linting:
    uses: ./.github/workflows/linting.yaml

  run-frontend-build:
    uses: ./.github/workflows/check-frontend-build.yaml

  run-unit-tests:
    uses: ./.github/workflows/unit_tests.yaml

  # Deploy to EC2 after all checks pass
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: [run-linting, run-frontend-build, run-unit-tests]
    if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true))
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY_PROD }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd ${{ secrets.EC2_PROJECT_PATH_PROD }}
            git checkout prod
            git pull origin prod
            sudo make server-restart
